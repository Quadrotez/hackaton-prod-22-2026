# NOTE: Shared job templates come from pipelines/pipelines (Spirit).
# Required CI/CD variables (see README "Deploy"):
#   SPIRIT_DOCKER_SA_KEY (File), DEPLOY_VM, DEPLOY_SSH_USER

stages:
  - prepare
  - test
  - build
  - deploy

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/docker.yaml
      - /jobs/rules.yaml
      - /jobs/teleport.yaml
      - /jobs/configure-docker.yaml

variables:
  REGISTRY: registry.spirit.t-education.com/hack-led-22

test:backend:
  stage: test
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run pytest

build:backend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/backend/Dockerfile
    IMAGE_NAME: $REGISTRY/backend:${CI_COMMIT_SHORT_SHA}

build:frontend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/frontend/Dockerfile
    IMAGE_NAME: $REGISTRY/frontend:${CI_COMMIT_SHORT_SHA}

deploy:
  stage: deploy
  image: registry.spirit.t-education.com/cicd-images/tsh-18:latest
  extends:
    - .teleport_auth
    - .rules-master
  variables:
    DEPLOY_SSH_USER: $DEPLOY_SSH_USER
    DEPLOY_VM: $DEPLOY_VM
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - tsh scp docker-compose.yml "${DEPLOY_SSH_USER}@${DEPLOY_VM}:/opt/petcare/docker-compose.yml"
    - tsh ssh "${DEPLOY_SSH_USER}@${DEPLOY_VM}" "cd /opt/petcare && TAG=${TAG} docker compose pull && TAG=${TAG} docker compose up -d --remove-orphans"

prepare:docker:
  stage: prepare
  extends: .configure_docker
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  variables:
    DEPLOY_SSH_USER: $DEPLOY_SSH_USER
    DEPLOY_VM: $DEPLOY_VM
