# NOTE: Shared job templates come from pipelines/pipelines (Spirit).
# Deploy goes to the Spirit VM over SSH as a dedicated, key-only "deployer" user.
# Required CI/CD variables (project secrets):
#   SPIRIT_DOCKER_SA_KEY (File) - service-account key for the private registry
#   SSH_PRIVATE_KEY (File)      - private key of the VM deploy user
#   DEPLOY_USER, DEPLOY_HOST    - deploy user name and VM address

stages:
  - prepare
  - test
  - build
  - docs
  - deploy

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/docker.yaml
      - /jobs/rules.yaml

variables:
  REGISTRY: registry.spirit.t-education.com/hack-led-22
  DP_CLI_VERSION: 14.1.3
  SSH_ADDRESS: $DEPLOY_USER@$DEPLOY_HOST

test:backend:
  stage: test
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run pytest

build:backend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/backend/Dockerfile
    IMAGE_NAME: $REGISTRY/backend:${CI_COMMIT_SHORT_SHA}

build:frontend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/frontend/Dockerfile
    IMAGE_NAME: $REGISTRY/frontend:${CI_COMMIT_SHORT_SHA}

# Builds the OpenAPI schema + a static Swagger UI and exposes them as pipeline
# artifacts for every branch (GitLab Pages is disabled in this environment).
# Each pipeline keeps the docs for its own commit: use the "Swagger UI" artifact
# link in the job/MR, or download the archive.
docs:openapi:
  stage: docs
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/docs-venv
    JWT_SECRET_KEY: openapi-static-export
    OPENAPI_SERVER_URL: https://petcare.quadrotez.com
    OPENAPI_DOCS_LABEL: $CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run python scripts/export_openapi.py "$CI_PROJECT_DIR/openapi"
  artifacts:
    name: "openapi-$CI_COMMIT_REF_SLUG"
    expire_in: 4 weeks
    expose_as: "Swagger UI"
    paths:
      - openapi/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.ssh_setup:
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
    - sed -i 's/\\n/\n/g; s/\r$//' ~/.ssh/id_deploy
    - |
      if ! grep -q 'PRIVATE KEY' ~/.ssh/id_deploy; then
        base64 -d ~/.ssh/id_deploy > ~/.ssh/id_deploy.dec && mv ~/.ssh/id_deploy.dec ~/.ssh/id_deploy
      fi
    # GitLab File variables drop the trailing newline; OpenSSH needs it.
    - printf '\n' >> ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - |
      echo "SSH key diag: lines=$(wc -l < ~/.ssh/id_deploy) bytes=$(wc -c < ~/.ssh/id_deploy) prefix=$(head -c 27 ~/.ssh/id_deploy | tr '\n' ' ')"
    - ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/dev/null || { echo "SSH_PRIVATE_KEY is not a usable private key"; exit 1; }
    - ssh-keygen -lf ~/.ssh/id_deploy.pub
    - printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config && chmod 600 ~/.ssh/config

deploy:
  stage: deploy
  image: kroniak/ssh-client:3.19
  extends:
    - .rules-master
    - .ssh_setup
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    # Idempotent: make sure the deploy user on the VM can pull from the private Registry.
    - scp scripts/registry-login.sh "${SSH_ADDRESS}:/opt/petcare/registry-login.sh"
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      ssh $SSH_ADDRESS "bash /opt/petcare/registry-login.sh '$KEY_B64' ${DP_CLI_VERSION}"
    - scp docker-compose.yml "${SSH_ADDRESS}:/opt/petcare/docker-compose.yml"
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose pull && TAG=${TAG} docker compose up -d --remove-orphans"

# Creates/refreshes the demo account (demo@quadrotez.com) inside the running API
# container so the "Войти в демо" button keeps working. Idempotent.
demo:account:
  stage: deploy
  image: kroniak/ssh-client:3.19
  extends:
    - .rules-master
    - .ssh_setup
  needs:
    - deploy
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose exec -T api python scripts/create_demo_user.py"

prepare:docker:
  stage: prepare
  image: kroniak/ssh-client:3.19
  extends:
    - .ssh_setup
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  variables:
    DP_CLI_VERSION: 14.1.3
  script:
    - scp scripts/registry-login.sh "${SSH_ADDRESS}:/opt/petcare/registry-login.sh"
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      ssh $SSH_ADDRESS "bash /opt/petcare/registry-login.sh '$KEY_B64' ${DP_CLI_VERSION}"

