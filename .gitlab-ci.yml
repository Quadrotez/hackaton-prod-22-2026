# NOTE: Shared job templates come from pipelines/pipelines (Spirit).
# Required CI/CD variables (see README "Deploy"):
#   SPIRIT_DOCKER_SA_KEY (File), DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY_B64 (base64 of private key)

stages:
  - prepare
  - test
  - build
  - deploy

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/docker.yaml
      - /jobs/rules.yaml

variables:
  REGISTRY: registry.spirit.t-education.com/hack-led-22
  DP_CLI_VERSION: 14.1.0
  SSH_ADDRESS: $DEPLOY_USER@$DEPLOY_HOST

test:backend:
  stage: test
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run pytest

build:backend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/backend/Dockerfile
    IMAGE_NAME: $REGISTRY/backend:${CI_COMMIT_SHORT_SHA}

build:frontend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/frontend/Dockerfile
    IMAGE_NAME: $REGISTRY/frontend:${CI_COMMIT_SHORT_SHA}

deploy:
  stage: deploy
  extends:
    - .rules-master
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config && chmod 600 ~/.ssh/config
    - ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
  script:
    - scp -o StrictHostKeyChecking=no docker-compose.yml "${SSH_ADDRESS}:/opt/petcare/docker-compose.yml"
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose pull && TAG=${TAG} docker compose up -d --remove-orphans"

prepare:docker:
  stage: prepare
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  variables:
    DP_CLI_VERSION: 14.1.0
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config && chmod 600 ~/.ssh/config
    - ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
  script:
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      ssh $SSH_ADDRESS "
        set -e
        umask 077
        mkdir -p \$HOME/bin
        if ! command -v dp >/dev/null 2>&1 && [ ! -x \$HOME/bin/dp ]; then
          curl -fsSL https://spirit.t-education.com/cli/prod/${DP_CLI_VERSION}/linux/dp -o \$HOME/bin/dp
          chmod +x \$HOME/bin/dp
        fi
        export PATH=\$HOME/bin:\$PATH
        echo $KEY_B64 | base64 -d > \$HOME/sa-key.json
        dp auth service-acc --key-file \$HOME/sa-key.json
        dp auth configure-docker
        rm -f \$HOME/sa-key.json
      "
