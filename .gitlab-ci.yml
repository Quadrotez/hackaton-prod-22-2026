# NOTE: Shared job templates come from pipelines/pipelines (Spirit).
# Deploy goes to the Spirit VMaaS box over Teleport (tsh) - no public-IP SSH key needed.
# Required CI/CD variables (group/project secrets):
#   SPIRIT_DOCKER_SA_KEY (File)   - service-account key for the private registry
#   TELEPORT_TENANT, TELEPORT_PROXY - provided by the group for .teleport_auth
# The non-secret deploy target is set below; real CI/CD variables override it.

stages:
  - prepare
  - test
  - build
  - deploy

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/docker.yaml
      - /jobs/rules.yaml
      - /jobs/teleport.yaml
      - /jobs/configure-docker.yaml

variables:
  REGISTRY: registry.spirit.t-education.com/hack-led-22
  DP_CLI_VERSION: 14.1.0
  DEPLOY_VM: hack-led-22-vm1-606d53
  DEPLOY_SSH_USER: b5wvi9wxtn

test:backend:
  stage: test
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run pytest

build:backend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/backend/Dockerfile
    IMAGE_NAME: $REGISTRY/backend:${CI_COMMIT_SHORT_SHA}

build:frontend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/frontend/Dockerfile
    IMAGE_NAME: $REGISTRY/frontend:${CI_COMMIT_SHORT_SHA}

deploy:
  stage: deploy
  image: registry.spirit.t-education.com/cicd-images/tsh-18:latest
  extends:
    - .teleport_auth
    - .rules-master
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - tsh scp docker-compose.yml "${DEPLOY_SSH_USER}@${DEPLOY_VM}:/opt/petcare/docker-compose.yml"
    - tsh ssh "${DEPLOY_SSH_USER}@${DEPLOY_VM}" "cd /opt/petcare && TAG=${TAG} docker compose pull && TAG=${TAG} docker compose up -d --remove-orphans"

prepare:docker:
  stage: prepare
  image: registry.spirit.t-education.com/cicd-images/tsh-18:latest
  extends:
    - .teleport_auth
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  variables:
    DP_CLI_VERSION: 14.1.3
  script:
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      tsh ssh "${DEPLOY_SSH_USER}@${DEPLOY_VM}" "
        set -e
        umask 077
        mkdir -p \$HOME/bin
        # Use Spirit's dp explicitly: a system 'dp' (dynamic programming tool) may be on PATH.
        if [ ! -x \$HOME/bin/dp ]; then
          wget -q https://spirit.t-education.com/cli/tedu/${DP_CLI_VERSION}/linux/dp -O \$HOME/bin/dp
          chmod +x \$HOME/bin/dp
        fi
        echo $KEY_B64 | base64 -d > \$HOME/sa-key.json
        \$HOME/bin/dp auth service-acc --key-file \$HOME/sa-key.json
        \$HOME/bin/dp auth configure-kaniko
        rm -f \$HOME/sa-key.json
      "
