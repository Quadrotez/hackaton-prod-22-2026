# NOTE: Shared job templates come from pipelines/pipelines (Spirit).
# Deploy goes to the Spirit VM over SSH as a dedicated, key-only "deployer" user.
# Required CI/CD variables (project secrets):
#   SPIRIT_DOCKER_SA_KEY (File) - service-account key for the private registry
#   SSH_PRIVATE_KEY (File)      - private key of the VM deploy user
#   DEPLOY_USER, DEPLOY_HOST    - deploy user name and VM address
#   DB_PASSWORD                 - Postgres password (compose)
#   JWT_SECRET_KEY              - JWT signing secret (backend)
#   ACCESS_TOKEN_EXPIRE_MINUTES - access token TTL in minutes (optional, defaults to 30)
#   YANDEX_API_KEY              - Yandex AI key (backend)
#   YANDEX_FOLDER_ID            - Yandex Cloud folder id (backend)
#   SAGE_LOG_URL, SAGE_API_TOKEN - Sage Logs push endpoint + token (optional; off when empty)
#   SAGE_ENV, SAGE_SYSTEM, SAGE_INST - Sage required fields (defaults: prod, petcare, hostname)
# The deploy job renders /opt/petcare/.env from these on every deploy.

stages:
  - prepare
  - test
  - build
  - docs
  - deploy

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/docker.yaml
      - /jobs/rules.yaml

variables:
  REGISTRY: registry.spirit.t-education.com/hack-led-22
  DP_CLI_VERSION: 14.1.3
  SSH_ADDRESS: $DEPLOY_USER@$DEPLOY_HOST

# Тесты и линтеры: по умолчанию GitLab запускает jobs без rules только в
# branch-пайплайнах (only: branches, tags), и в пайплайн merge request они не
# попадали. Сохраняем запуск на push в любую ветку и тег и добавляем MR.
.rules-tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:backend:
  stage: test
  extends: .rules-tests
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run pytest --junitxml=report.xml --cov=app --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 2 weeks

test:frontend:
  stage: test
  extends: .rules-tests
  image: node:20
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm test

# Интеграционные тесты фронтенда: реальные lib-модули против настоящего FastAPI
# (изолированная SQLite). Требуют и Node, и Python-окружение бекенда.
test:frontend:integration:
  stage: test
  extends: .rules-tests
  image: node:20
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/venv
    PETCARE_TEST_PYTHON: /tmp/venv/bin/python
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --directory backend --frozen
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run test:integration

# Линтеры: статический анализ бекенда (ruff) и фронтенда (eslint).
# Идут в той же стадии, что и тесты, поэтому падение линта блокирует build/deploy.
lint:backend:
  stage: test
  extends: .rules-tests
  image: python:3.12
  before_script:
    - pip install --quiet "ruff==0.17.1"
    - cd backend
  script:
    - ruff check .

lint:frontend:
  stage: test
  extends: .rules-tests
  image: node:20
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run lint

# Миграции против настоящего PostgreSQL: SQLite-тесты ловят логику, но не
# диалект-специфичные ошибки (например, batch recreate при самоссылающемся FK),
# которые валят migrate уже на прод-деплое. Прогоняем всю цепочку вверх, вниз и
# снова вверх, чтобы блокировать build/deploy на таких регрессиях.
test:migrations:postgres:
  stage: test
  extends: .rules-tests
  image: python:3.12
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: petcare
    POSTGRES_PASSWORD: petcare
    POSTGRES_DB: petcare_test
    DATABASE_URL: postgresql+psycopg://petcare:petcare@postgres:5432/petcare_test
    JWT_SECRET_KEY: ci-postgres-migrations
    UV_PROJECT_ENVIRONMENT: /tmp/venv
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install --quiet uv
    - cd backend
  script:
    - until pg_isready -h postgres -U petcare -d petcare_test; do sleep 1; done
    - uv sync --frozen
    - uv run alembic upgrade head
    - uv run alembic downgrade base
    - uv run alembic upgrade head

build:backend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/backend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/backend/Dockerfile
    IMAGE_NAME: $REGISTRY/backend:${CI_COMMIT_SHORT_SHA}

build:frontend:
  stage: build
  extends:
    - .build
    - .rules-merge-or-master
  variables:
    CONTEXT: $CI_PROJECT_DIR/frontend
    DOCKERFILE_PATH: $CI_PROJECT_DIR/frontend/Dockerfile
    IMAGE_NAME: $REGISTRY/frontend:${CI_COMMIT_SHORT_SHA}

# Builds the OpenAPI schema + a static Swagger UI and exposes them as pipeline
# artifacts for every branch (GitLab Pages is disabled in this environment).
# Each pipeline keeps the docs for its own commit: use the "Swagger UI" artifact
# link in the job/MR, or download the archive.
docs:openapi:
  stage: docs
  image: python:3.12
  variables:
    UV_PROJECT_ENVIRONMENT: /tmp/docs-venv
    JWT_SECRET_KEY: openapi-static-export
    OPENAPI_SERVER_URL: https://petcare.quadrotez.com
    OPENAPI_DOCS_LABEL: $CI_COMMIT_REF_NAME @ $CI_COMMIT_SHORT_SHA
  before_script:
    - pip install --quiet uv
    - cd backend
  script:
    - uv sync --frozen
    - uv run python scripts/export_openapi.py "$CI_PROJECT_DIR/openapi"
  artifacts:
    name: "openapi-$CI_COMMIT_REF_SLUG"
    expire_in: 4 weeks
    expose_as: "Swagger UI"
    paths:
      - openapi/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

.ssh_setup:
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
    - sed -i 's/\\n/\n/g; s/\r$//' ~/.ssh/id_deploy
    - |
      if ! grep -q 'PRIVATE KEY' ~/.ssh/id_deploy; then
        base64 -d ~/.ssh/id_deploy > ~/.ssh/id_deploy.dec && mv ~/.ssh/id_deploy.dec ~/.ssh/id_deploy
      fi
    # GitLab File variables drop the trailing newline; OpenSSH needs it.
    - printf '\n' >> ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - |
      echo "SSH key diag: lines=$(wc -l < ~/.ssh/id_deploy) bytes=$(wc -c < ~/.ssh/id_deploy) prefix=$(head -c 27 ~/.ssh/id_deploy | tr '\n' ' ')"
    - ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/dev/null || { echo "SSH_PRIVATE_KEY is not a usable private key"; exit 1; }
    - ssh-keygen -lf ~/.ssh/id_deploy.pub
    - printf 'Host *\n  StrictHostKeyChecking no\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config && chmod 600 ~/.ssh/config

deploy:
  stage: deploy
  image: kroniak/ssh-client:3.19
  extends:
    - .rules-master
    - .ssh_setup
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    # Idempotent: make sure the deploy user on the VM can pull from the private Registry.
    - scp scripts/registry-login.sh "${SSH_ADDRESS}:/opt/petcare/registry-login.sh"
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      ssh $SSH_ADDRESS "bash /opt/petcare/registry-login.sh '$KEY_B64' ${DP_CLI_VERSION}"
    - scp docker-compose.yml "${SSH_ADDRESS}:/opt/petcare/docker-compose.yml"
    # Render the runtime env file from CI/CD variables, so no .env has to be
    # created or kept by hand on the VM. Values are streamed over stdin (never
    # on the command line), so secrets do not leak into `ps` or logs.
    - |
      cat <<ENV_EOF | ssh $SSH_ADDRESS "cat > /opt/petcare/.env && chmod 600 /opt/petcare/.env"
      # Last deployed image tag: docker compose reads it from .env, so manual
      # `docker compose logs/ps/top` work without exporting TAG by hand.
      TAG=${TAG}
      DB_PASSWORD=${DB_PASSWORD}
      JWT_SECRET_KEY=${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      YANDEX_API_KEY=${YANDEX_API_KEY}
      YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      LOG_LEVEL=${LOG_LEVEL:-INFO}
      LOG_FORMAT=json
      SAGE_LOG_URL=${SAGE_LOG_URL}
      SAGE_API_TOKEN=${SAGE_API_TOKEN}
      SAGE_LOG_TIMEOUT_SECONDS=${SAGE_LOG_TIMEOUT_SECONDS:-5}
      SAGE_ENV=${SAGE_ENV:-prod}
      SAGE_SYSTEM=${SAGE_SYSTEM:-petcare}
      SAGE_INST=${SAGE_INST:-}
      ENV_EOF
    # Pre-flight: миграция в одноразовом контейнере ДО того, как трогать api/site.
    # Если она падает — прод продолжает крутить предыдущий образ (без окна 502).
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose pull && TAG=${TAG} docker compose run --rm migrate"
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose up -d --remove-orphans"

# Rebuilds the demo accounts (see backend/scripts/create_demo_user.py) inside the running
# API container so the demo login buttons keep working. Idempotent.
demo:account:
  stage: deploy
  image: kroniak/ssh-client:3.19
  extends:
    - .rules-master
    - .ssh_setup
  needs:
    - deploy
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - ssh $SSH_ADDRESS "cd /opt/petcare && TAG=${TAG} docker compose exec -T api python scripts/create_demo_user.py"

prepare:docker:
  stage: prepare
  image: kroniak/ssh-client:3.19
  extends:
    - .ssh_setup
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  variables:
    DP_CLI_VERSION: 14.1.3
  script:
    - scp scripts/registry-login.sh "${SSH_ADDRESS}:/opt/petcare/registry-login.sh"
    - |
      KEY_B64=$(base64 -w0 "$SPIRIT_DOCKER_SA_KEY")
      ssh $SSH_ADDRESS "bash /opt/petcare/registry-login.sh '$KEY_B64' ${DP_CLI_VERSION}"
