[project]
name = "petcare-backend"
version = "0.1.0"
description = "PetCare backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "openai>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.30",
    "tzdata>=2025.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]
# Пустой src: не считать каталог alembic/ исходником (иначе его импорты
# группируются с app как first-party)
src = []

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # FastAPI: Depends()/File()/Query() в дефолтах аргументов — идиома фреймворка
    "B008",
    # PEP 695-дженерики: кодовая база на классическом TypeVar, миграция не окупается
    "UP047",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Многострочные тексты LLM-промптов: noqa внутри строк не работает,
# а перенос/обрезка меняет содержание промпта
"app/integrations/llm/vet_document_analyzer.py" = ["E501", "W291"]
