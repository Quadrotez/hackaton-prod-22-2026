name: petcare

# Deployed to /opt/petcare on the VM by CI. Secrets live in /opt/petcare/.env
# (not in this repo). TAG is the image tag, set by CI at deploy time.

x-backend-image: &backend-image registry.spirit.t-education.com/hack-led-22/backend:${TAG:?TAG is required}

services:
  db:
    image: postgres:16-alpine
    container_name: petcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: petcare_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: *backend-image
    container_name: petcare-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://petcare:${DB_PASSWORD}@db:5432/petcare_db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    image: *backend-image
    container_name: petcare-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://petcare:${DB_PASSWORD}@db:5432/petcare_db
      MEDIA_DIR: /data/media
    volumes:
      - mediadata:/data/media
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  site:
    image: registry.spirit.t-education.com/hack-led-22/frontend:${TAG}
    container_name: petcare-site
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    networks:
      - internal
      - proxy_network

volumes:
  pgdata:
  mediadata:

networks:
  internal:
  proxy_network:
    external: true
